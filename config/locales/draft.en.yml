# The working draft: the whole of a live Day, masthead to Action slip. See
# `reads.en.yml` for how copy reaches a page and which classes print it in
# capitals.
#
# `reads.draft` is the page's fixed copy and is handed to it as a subtree by
# `WorkingDraft`. The sentences a read composes on its own — the Morning
# Briefing's, the term sheet's empty state, the memo's — keep the read's name,
# and live here because this is the page they print on.
en:
  reads:
    morning_briefing:
      # The briefing's three sections that can hold nothing. Every empty state
      # instructs: a heading over white space is the one thing an empty section
      # must not be.
      landed:
        empty: >-
          Nothing's due back today. Actions we buy below come back here on the
          morning they're due.
      served:
        empty: >-
          Nothing's been served on us yet. When the other Side sends an Offer
          with Exhibits attached, we get copies here. If one arrives, Consult
          the Client — it may have moved them.
      # Unreachable in the reference Case, which authors documents at the open
      # for both Sides, and owed a sentence all the same.
      what_you_start_with:
        empty: >-
          No documents came with the file. What we learn will come from Actions
          we buy and papers the other Side serves on us.
      grammar: >-
        Work the Case File in any order. Before we send an Offer, a teammate
        has to countersign it. The Day ends once both Teams are done.
      rubric:
        dimensions:
          - Settlement quality, 40 points
          - Legal strategy, 30 points
          - Collaboration, 20 points
          - Efficiency, 10 points
        bonus: >-
          Creative terms: up to 10 bonus points on top of the 100. Grades appear
          when the Instructor releases them.
        # The dimensions, joined, then the bonus.
        published: "%{dimensions}. %{bonus}"
    terms_board:
      empty: >-
        Nobody has offered anything yet. Tick the Terms we want below and fill
        in any figures. A blank line means no one has offered on that Term, not
        that they offered zero.
    consult_memo:
      # The price is the Case's own, so the count and the half are the
      # Consult's as authored rather than a 1 written in.
      empty:
        one: >-
          Consult the Client when something has changed. It costs %{count}
          %{half} point, and it's the only way to see how far they'll move.
        other: >-
          Consult the Client when something has changed. It costs %{count}
          %{half} points, and it's the only way to see how far they'll move.
    draft:
      title: "%{matter} — Day %{day}"
      turn:
        looking_at_front: You are looking at the draft.
        looking_at_back: You are looking at the back of the file.
        to_back: Turn the page over
        to_front: Turn back to the draft
      front_matter:
        heading: Morning Briefing · Day %{day}
        landed: Arrived this morning
        served: Served on us
        served_stamp: Served
        started_with: What we started with
        # Neither a pronoun nor a role: the two Clients are different people and
        # `case_clients` carries no name.
        client_said: What the Client told us on Day 1
        calendar: The calendar
        # Read aloud per Day; the page prints only the ordinal.
        calendar_day:
          today: Day %{day}, %{date}, today
          closed: Day %{day}, %{date}, closed
          ahead: Day %{day}, %{date}
        calendar_span: "%{count} Days, %{first} to %{last}."
        graded: How you're graded
      term_sheet:
        heading: Draft terms of settlement
        marks:
          pending: Not shared yet
          drafted: Draft — not sent
          sent: Sent · Day %{day}
        byline: "%{matter} · Day %{day}"
        byline_drawn: "%{matter} · Day %{day} · drafted by %{name}"
        # The table's reading convention. The first is the sheet a Team can
        # still write on; the second is a record.
        caption:
          writable: >-
            Struck through: their latest Offer · Written in: ours · Margin: what
            the Client wants. Write ours on the same line as theirs.
          record: >-
            Struck through: their latest Offer · Written in: ours · Margin: what
            the Client wants.
        # A House Rule, said under the caption where it bites: only on a sheet
        # we can still write on, with their Offer struck across it.
        house_rule: >-
          In this game, their Offer stays open until we accept it or the game
          ends, even after we counter. At law, a counteroffer rejects it.
        # Visually hidden: what each column is, for a reader who cannot see the
        # strike.
        columns:
          term: Term
          theirs: Their latest Offer
          ours: Ours
          aspiration: What the Client wants
        # A Term on the sheet with no figure. A settlement including an apology
        # includes an apology.
        included: Included
        asked_for: Asked for
        figure: Our figure for %{term}, in dollars
      drawing:
        note: Covering note
        note_placeholder: A line to the other Side (optional)
        draw: Share with the Team
        # Why the control is dead, before anything is posted.
        withheld:
          no_terms: Tick at least one Term first.
          no_amount: Enter a dollar figure first.
        unposted: Not shared yet — the Team still sees our last version.
      clipped:
        heading: Exhibits · clipped to this draft
        played: Played
        exhibit: Exhibit
        foot: >-
          Tick a document to attach it as an Exhibit. When we send the Offer,
          the other Side is served with a copy, and it may move their Client.
      countersignature:
        heading: Executed by
        drawn_by: Drawn by
        waived: Countersignature waived by the instructor
        countersigned_by: Countersigned by
        countersigned_by_one_of: "Countersigned by: %{names}"
        refused: Refused
        execute: Execute this draft
        stub: "%{price} · %{left} %{half} left after · this also commits your Day"
        confirm_label: Confirm executing this draft
        confirm: Confirm
        cancel: Cancel
      acceptance:
        heading: Their offer, open on the table
        drawn: >-
          The terms struck through on the sheet above, drawn by %{name} and
          committed on Day %{day}.
        refused: Refused
        accept: Accept their offer
        no_cost: no cost
        countersigned_by: Countersigned by
        countersigns: "%{name} countersigns"
        consequence: this closes Day %{day} and settles the matter · there is nothing after it
        confirm_label: Confirm accepting their offer
        confirm: Confirm
        cancel: Cancel
      memo:
        heading: Consult memo · the Client
        # Followed by the band, in bold.
        band: The Client is
      slip:
        heading: "Actions · left today: %{remaining}"
        arrives_today: arrives today
        arrives_on: arrives Day %{day}
        line: "%{points} · %{arriving}"
        # The stub's own, because there the arrival is a sentence of its own.
        stub_arrives_today: Arrives today.
        stub_arrives_on: Arrives Day %{day}.
        stub: "Costs %{points} (%{left} left after). %{arriving}"
        spend: Buy
        spend_label: "Buy: %{action}"
        confirm_label: "Confirm: %{action}"
        refused: Refused
        confirm: Confirm
        cancel: Cancel
