# The Instructor's minute. Its own terser voice: the Instructor is not in the
# dispute and reads this for one act. See `reads.en.yml` for how copy reaches a
# page and which classes print it in capitals.
en:
  reads:
    minute:
      title:
        sitting: Minute — Day %{day}
        settled: Minute — settled
      settled: Settled
      heading: Minute of the Instructor
      matter:
        sitting: "%{matter} · Day %{day} of %{of}"
        closed: "%{matter} · Day %{day} of %{of} · this Day has closed"
        settled: "%{matter} · settled on Day %{day}"
      closed:
        heading: Settled
        body: >-
          The Sides settled on Day %{day}, %{date}. No more Days open, and
          there's nothing left to waive.
      waivers:
        heading: Waive a countersignature
        rubric: >-
          Lets a Team send its Offer without a teammate's countersignature.
          Today only. Use it when teammates are absent. Cannot be undone.
        drawn: Draft waiting for a countersignature
        undrawn: No draft waiting
        granted: Countersignature waived for this Day by %{name}, %{at}.
        waive: Waive the countersignature
        waive_label: Waive the countersignature for the %{role}
