# Interface copy: every word the machine says to a student or the Instructor.
#
# Three kinds of text reach a reader and only this one is written under
# `config/locales/`. Authored prose — a document's body, a Client's opening
# statement, a Term's label — belongs to the Case. Generated dialogue is a
# Dialogue Node, written offline against a Client's persona. Everything that
# describes the *machine* rather than the dispute is here, and none of it is in
# a `.svelte` file: `spec/frontend/no_english_in_components_spec.rb` fails on a
# word in a component.
#
# One file per surface, so a reviewer reads one place per page:
#
#   reads.en.yml                the marks every surface shares (this file)
#   draft.en.yml                the working draft, front matter to Action slip
#   back_of_file.en.yml         the Case File and the Docket
#   executed_instrument.en.yml  the settled run's front
#   minute.en.yml               the Instructor's page
#   refusals.en.yml             why an act was turned down, on any surface
#
# A composer (`WorkingDraft`, `ExecutedFile`, `Minute`) is the only route to a
# page. A surface's fixed labels go over as its subtree; anything carrying a
# value — an ordinal, a count, a name, a date — is composed in Ruby with
# interpolation, so the page never assembles a sentence.
#
# **Capitals are typography.** These classes set `text-transform: uppercase`, so
# what reads *Landed today* here prints *LANDED TODAY*: `.doc-sub`, `.stamp`,
# `.control`, `.tab-clip`, `.draft-mark`, `.cap`, `.reads` and the masthead's
# `.turn button`. Write sentence case and let the stylesheet shout.
#
# The empty states are the whole of Onboarding. There is no first-run pass and no
# per-student progress flag — the empty state is the tutorial, so those
# sentences do the work a tour would otherwise do.
en:
  date:
    formats:
      # In-fiction dates, on every surface: "March 4, 2026".
      in_fiction: "%B %-d, %Y"
  time:
    formats:
      # When an Instructor's act was minuted. Wall-clock time, in the app's zone.
      minuted: "%b %-d, %-l:%M %p"
  reads:
    # A Side is named by its role. The engine's value is lowercase and is never
    # printed.
    roles:
      plaintiff: Plaintiff
      defendant: Defendant
    day: Day %{day}
    day_of: Day %{day}/%{of}
    # What an act costs, out of which half.
    price: "%{cost} %{half}"
    # A count of Budget points out of one half, with its unit: "1 preparation
    # point", "2 exchange points". `figure` is the count as printed, which is a
    # dash where a half has no Budget to count.
    points:
      one: "%{figure} %{half} point"
      other: "%{figure} %{half} points"
    # What a Reaction Band reads as. Two surfaces name one — the memo a Consult
    # bought and the Docket line beside it — so there is one key rather than
    # two: a band spelled differently on the two faces of one instrument would
    # be two vocabularies for one rule. The words are the ones `CONTEXT.md`
    # names the bands by under *Reaction Band*, because a band is qualitative
    # and paraphrasing it here would be the engine interpreting the Client.
    bands:
      firm: firm
      ready: ready
    # An Action's kind and a Budget half are the engine's own closed
    # vocabularies, printed on the slip, the countersignature block and the
    # Docket alike.
    action_board:
      kinds:
        consult_client: Consult the Client
        request_documents: Request documents
        research_precedent: Research precedent
        manage_press: Manage the press
        depose_witness: Depose a witness
        retain_expert: Retain an expert
      halves:
        preparation: preparation
        exchange: exchange
