# The back of the file: the Case File and the Docket, on both faces of the game
# — a live Day and a settled run turn over to the same back. See `reads.en.yml`
# for how copy reaches a page and which classes print it in capitals.
en:
  reads:
    case_file:
      empty: >-
        Nothing here yet. Documents our Actions turn up, and papers the other
        Side serves on us, are filed here.
    docket:
      empty: >-
        Nothing yet. Each Action we buy is logged here with who bought it, what
        it cost and the Day it arrives.
      acts:
        offer_staged: Shared a draft
        # The commit is a spend and has a price, so it sits among these rather
        # than with the costless three for one reason only: there is no authored
        # Action behind it to take a name from. ADR 0009: an Offer is sent, not
        # executed.
        offer_committed: Sent an Offer
        offer_accepted: Accepted their Offer
        second_waived: Countersignature waived by the Instructor
    back_of_file:
      heading: Back of the file
      papers: Case File · the papers
      served: Served
      exhibit: Exhibit
      played: Exhibit played
      at_the_open: Had from the start
      docket: Docket
      band: the Client reads %{band}
      # Rule 8: every number carries its unit, so the Docket counts points
      # itself rather than reusing the bare `reads.price`.
      lands:
        one: "%{count} %{half} point · arrives Day %{day}"
        other: "%{count} %{half} points · arrives Day %{day}"
      no_cost: no cost
