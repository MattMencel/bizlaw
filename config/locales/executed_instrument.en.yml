# The executed instrument: the front of a settled run. Its back is
# `back_of_file.en.yml`. See `reads.en.yml` for how copy reaches a page and
# which classes print it in capitals.
en:
  reads:
    executed_instrument:
      title: "%{matter} — settled"
      settled: Settled
      turn:
        looking_at_front: You are looking at the executed agreement.
        looking_at_back: You are looking at the back of the file.
        to_back: Turn the page over
        to_front: Turn back to the agreement
      terms:
        heading: Terms of settlement
        mark: Executed
        caption: Executed on Day %{day}, %{date}. Both Sides signed these Terms.
        columns:
          term: Term
          agreed: As agreed
        # A Term agreed without a figure is the Term itself.
        included: Included
        # Two House Rules (#393) in one pair: what this instrument leaves out.
        # The same words on every settlement, so they say nothing about how the
        # deal landed (ADR 0007).
        leaves_out: >-
          In this game, the agreement carries only these Terms, and we settled
          without asking the Client. At law, it would also carry a release of the
          claim and a dismissal of the suit, and it would need the Client's
          consent.
      signatures:
        heading: Executed by
        for: For the %{role}
        signed_by: Signed by
        countersigned_by: Countersigned by
        waived: Countersignature waived by the instructor
      beat:
        heading: Your Client
