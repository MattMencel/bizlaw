# What a refusal reads as. `Days::Command` names every rule it turns an act
# down by with a symbol, and the symbols are one closed vocabulary across both
# its acts — so this is its own file rather than under any one surface, and the
# slip, the sheet, the countersignature block, the acceptance block and the
# Minute all read it.
#
# A commit is executing a draft rather than buying a menu entry — the
# distinction `docket_entries.case_action_id` is nullable for — so no surface
# owns words another surface also says.
#
# Every symbol the seams can return has a sentence here, including ones no page
# offers a control for. `spec/reads/refusal_sentences_spec.rb` reads the seams
# and fails on a symbol with no key, and the test environment raises on a
# missing key besides, so an uncovered symbol never prints *Translation missing*
# at a student.
#
# One of these is reached only past the page, by a request the page never
# sends. `the_day_has_not_opened` needs an ordinal after the sitting Day,
# because only the sitting Day is both open and budgeted.
#
# Two more are returned and never printed. `the_simulation_has_settled` and
# `the_matter_has_already_settled` refuse acts on a settled run, and a settled
# run renders the executed instrument, which prints no refusal. See
# `Demo::RunsController#executed`.
#
# And one is never returned through the demo at all. `an_exhibit_has_already_
# been_played` needs a draft carrying an Exhibit that was played after the draft
# was drawn. Only a commit plays an Exhibit, a Team commits once a Day, and
# `Offers::Stage` refuses a Day that has not opened, so the one draft a Team can
# hold is on the sitting Day and nothing else can spend what rides it.
# `Days::Command` keeps the check because the rule is the seam's, not the
# demo's; `spec/services/exhibits/play_spec.rb` reaches it directly.
#
# `an_offer_has_already_been_committed_today` is shared by both ends of one
# rule — `Days::Command` refusing the second commit, and `Offers::Stage`
# refusing the draft that would be revised under it — which is the argument for
# this block sitting where it does rather than under either seam.
en:
  reads:
    refusals:
      an_exhibit_has_already_been_played: >-
        An Exhibit riding this draft has already been played. Put the draft
        back on the table without it.
      an_offer_has_already_been_committed_today: >-
        Your team has already executed an offer today.
      # Split by the half that refused, because the next move differs: the
      # preparation half buys Actions, and the exchange half pays for the Offer
      # and the Exhibits riding it. The composer picks by the refused quote's
      # half.
      the_budget_cannot_cover_it:
        preparation: >-
          Not enough preparation points left today. Pick a cheaper Action, or
          wait for tomorrow's points.
        exchange: >-
          Not enough exchange points left today. Drop an Exhibit from the draft,
          or send it tomorrow.
      the_day_has_closed: >-
        This Day has closed. The next one opens on the Instructor's schedule.
      the_day_has_not_opened: >-
        This Day has not opened yet.
      the_offer_has_not_been_seconded: >-
        A teammate has to countersign the draft before it can be executed.
      # The Acceptance's own, and not the draft's. The gate is the same rule and
      # the sentence is not: one is about a position this Team is putting on the
      # table, and this one is about taking the other Side's — a reader told to
      # countersign *the draft* would look at the wrong instrument.
      the_acceptance_has_not_been_seconded: >-
        A teammate has to countersign before their offer can be accepted.
      # Distinct from `the_simulation_has_settled`, which is what a *spend* is
      # refused for and says there is nothing left to buy. An Acceptance beaten
      # across the table was not refused for having nothing to buy; it was
      # refused because the thing it was reaching for has already happened.
      the_matter_has_already_settled: >-
        The matter has already settled. There is nothing left to accept.
      there_is_no_offer_on_the_table: >-
        There is no draft to execute. Write your terms above and put them on the
        table first.
      the_result_would_land_past_the_last_day: >-
        Too late: this would arrive after the last Day. Pick an Action that
        arrives sooner.
      the_simulation_has_settled: >-
        The matter has settled. There is nothing left to buy.
