---
version: 2
updates:
  # Ruby/Rails dependencies
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      rails-core:
        patterns:
          - "rails"
          - "sqlite3"
          - "jbuilder"
          - "solid_cache"
          - "solid_queue"
          - "solid_cable"
          - "bootsnap"
          - "tzinfo-data"
          - "puma"
          - "thruster"
      development-tools:
        patterns:
          - "web-console"
          - "debug"
          - "dotenv-rails"
          - "brakeman"
      linting:
        patterns:
          - "standard"
          - "standard-rails"
          - "rubocop*"
      test-framework:
        patterns:
          - "rspec-rails"
          - "cucumber*"

      # All patch updates together, may be merged when CI is green.
      patch-updates:
        update-types: ["patch"]

      # All minor updates together. Requires green CI + manual check.
      minor-updates:
        update-types: ["minor"]

  # Documentation site dependencies
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@mdx-js/*"
      dev-tools:
        patterns:
          - "typescript"
          - "@types/*"
      ui-utilities:
        patterns:
          - "clsx"
          - "prism-react-renderer"

      # All patch updates together, may be merged when CI is green.
      patch-updates:
        update-types: ["patch"]

      # All minor updates together. Requires green CI + manual check.
      minor-updates:
        update-types: ["minor"]

  # Docker dependencies
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # All patch updates together, may be merged when CI is green.
      patch-updates:
        update-types: ["patch"]

      # All minor updates together. Requires green CI + manual check.
      minor-updates:
        update-types: ["minor"]
