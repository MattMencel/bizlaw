# The reference Case's skeleton — its identity and its in-fiction calendar.
#
# This is not authored teaching material. Cases are proprietary and live in a
# separate private repository; what sits here is the minimum an engine test and
# a development run need, and the calendar the design's numbers were measured
# against: 10 Days.
---
identifier: bizlaw/reference
name: The Reference Case
licence: Apache-2.0
version: "1.1.0"
published: true
# The Action Budget, measured on prototype/action-budget-pricing rather than
# chosen. The exchange half is an absolute count of points: held as a fraction
# it would couple the brake to the Budget size. Past the knee the preparation
# allowance collapses to roughly the price of a Consult and the exchange half
# widens by one point.
budget:
  per_day: 10
  exchange_pool: 2
  # What an Exhibit costs to ride a committed Offer. It and the pool above are
  # one decision rather than two: the Offer costs one point, so at a pool of two
  # an Exhibit priced at two means nothing can ever be played, and separation
  # across the joint grid falls from 84 to 10.
  exhibit_price: 1
  closing_knee: 0.60
  closing_preparation: 2
  closing_exchange: 3
calendar:
  - 2026-03-02
  - 2026-03-03
  - 2026-03-04
  - 2026-03-05
  - 2026-03-06
  - 2026-03-09
  - 2026-03-10
  - 2026-03-11
  - 2026-03-12
  - 2026-03-13
# The Action menu. The kind is engine — the engine knows what deposing a witness
# means — while the cost, the lead time in Days and the half it draws on are
# authored here, because the economy is teaching material rather than engine
# constants. A lead time of 0 lands the result on the Day it was bought.
#
# All of it draws on the preparation half: the exchange half buys an Offer and
# the Exhibits riding it, and nothing else.
actions:
  consult_client:
    cost: 1
    lead_time_days: 0
    half: preparation
  request_documents:
    cost: 2
    lead_time_days: 1
    half: preparation
  research_precedent:
    cost: 2
    lead_time_days: 1
    half: preparation
  manage_press:
    cost: 2
    lead_time_days: 1
    half: preparation
  depose_witness:
    cost: 3
    lead_time_days: 2
    half: preparation
  retain_expert:
    cost: 5
    lead_time_days: 2
    half: preparation
# The two Clients. The bound is how far a Client may be moved across one whole
# Simulation, and it is the one thing about a Client authored as money. Every
# shift against it is a fraction of it, so an Exhibit is worth the same share of
# a Client's travel whether the Section made that Client easy or hard.
#
# The opening statement is what they say they want on the Day their Team first
# sits down, and one of the Morning Briefing's what-you-start-with sections. It
# is authored prose that never reaches the model, because it is an object in the
# dispute rather than a line about something the engine computed.
#
# The settlement pair is the other kind: a Dialogue Node, which a real Case has
# generated offline against the Client's persona. These four are hand-authored,
# because the reference Case is what an engine test and a local run read and no
# model runs for either. Keyed on which Side accepted and carrying no variants —
# a settlement node is spoken exactly once, so there is nothing to select on.
#
# The portrait seed is the whole of what a Case says about a Client's face. It
# is opaque, and deliberately: a named part choice does not survive the set
# being reskinned, so an author rerolls the string until they like the face. The
# two below must not compose to the same person — they are the one pair a reader
# ever sees together — and `Cases::Import` refuses the Case if they do.
clients:
  plaintiff:
    bound: 40000
    portrait_seed: greaves-plaintiff
    opening_statement: |
      Eleven years I gave them, and not one review below "meets expectations".
      They walked me out through the plant floor like I had stolen something. I
      want my name back, and I want them to say out loud what they did.
    settlement:
      took_it: |
        I read it three times before I put my name on it. It is not everything I
        asked for, and I have stopped pretending there was ever a version where
        it would be. But it is theirs, in writing, and I am the one who decided
        it was enough. I would like to go home now.
      had_it_taken: |
        They signed it. My number, my words, and their name underneath. Eleven
        years and it comes down to two pages — but they are my two pages, and
        nobody handed them to me. Tell me that is really the end of it.
    # What this Client says out loud about the Terms, and the Terms Board's
    # third track. Sparse: a Term absent here is one they are indifferent
    # about, and its track carries the two live positions and no marker. An
    # amount is whole money like the bound; a Term written without one is
    # wanted without a figure, which is most of them.
    aspirations:
      money: 250000
      apology:
      reinstatement:
    # What this Client says when their Team consults them, and the only read a
    # Team ever gets on how far the Client has moved. Two bands is engine; `at`
    # is the Case's — the cumulative fraction of the bound at which the Client
    # crosses into that band. The lower one begins at nothing, because a Client
    # who has not moved is still in a band.
    #
    # A band carries several variants, because the Consult is priced to be
    # bought more than once and one line would come back word for word. These
    # are Dialogue Nodes: a real Case generates them offline against the
    # Client's persona, and the eight here are hand-authored for the same reason
    # the settlement pair is — no model runs for an engine test or a local run.
    #
    # None of them names a number. A figure a line cannot see is a figure a line
    # cannot leak, and the band is qualitative on purpose: no reservation point,
    # no bound, no size of any shift.
    bands:
      firm:
        at: 0.0
        lines:
          - |
            No. I have thought about it and the answer is still no. They can
            keep sending paper over; it does not change what happened on that
            floor in front of everybody, and it does not change what I am
            asking for.
          - |
            You want me to be reasonable. I have been reasonable for eleven
            years. I am not moving, and if that makes this take longer then it
            takes longer — I am not the one who has somewhere to be.
      ready:
        at: 0.8
        lines:
          - |
            I am tired. I still think I am right, and I am starting to think
            that being right is not going to be worth what it is costing me. If
            you can get me something I can live with, bring it and I will look
            at it properly.
          - |
            Ask me what I want and a month ago I would have said all of it. Now
            I would settle for going one whole day without thinking about them.
            Get close enough and I will sign, and I would rather that were
            sooner.
  defendant:
    bound: 60000
    portrait_seed: hollis-defendant
    opening_statement: |
      We followed the policy that was written down, and the policy was there for
      a reason. What I cannot have is this in the trade press for six months. I
      want it closed, closed quietly, and closed without anyone admitting to
      something that did not happen.
    settlement:
      took_it: |
        Fine. We take their paper, and we take it today, before somebody decides
        there is a story here. I am not saying we were wrong. I am saying I have
        a plant to run and I would very much like to get back to running it.
      had_it_taken: |
        They signed ours. Good — that is the version I can live with, and it is
        the one I would have had to stand up and explain. Get it filed, keep it
        quiet, and let us not be in this room again.
    aspirations:
      money: 25000
      nda:
    bands:
      firm:
        at: 0.0
        lines:
          - |
            We are not paying to make this go away on their terms. The policy
            was written down, it was followed, and the moment we start
            negotiating against ourselves every other file in that cabinet
            becomes a claim. Hold the line.
          - |
            My answer has not changed since the first meeting. Tell them we are
            content to let this run its course. I have a plant to run and I
            would rather run it than sit here talking about this.
      ready:
        at: 0.8
        lines:
          - |
            All right. I have been through this with the board and I am hearing
            that the longer it sits, the worse it looks. If there is a version
            of this that ends quietly and soon, I want to hear it — quietly is
            the part I care about.
          - |
            I would like this closed. Not because they are right, they are not,
            but because I am spending my week on it and my week is worth
            something. Find me terms I can put in front of the board without
            flinching and we are done.
# The vocabulary an Offer is built from and an Exhibit bears on. Terms are
# atomic: a public apology and a private one would be two Terms, never one Term
# with a setting.
terms:
  - money
  - apology
  - nda
  - reinstatement
  - training
  - reference_letter
  - policy_change
# Every document names the Action it waits behind or the **hand** it sits in at
# the open, and never both. That xor is what makes *doors visible, contents
# hidden* checkable: nothing a Team starts with can also be something it finds.
# A hand is `both_sides`, `plaintiff` or `defendant`.
#
# Some documents also carry an **exhibit** — a target Client, a shift as a
# fraction of that Client's bound, and the Terms it bears on. Whether it is
# favorable is not authored: an Exhibit pointing at the other Side's Client is
# held and played, and one pointing at your own lands the moment you find it.
# So the deposition below is ammunition for the defendant and a hard lesson for
# the plaintiff, and one authored document is both.
#
# A document in hand at the open may carry a favorable Exhibit and never an
# unfavorable one; the two below carry none, so the Exhibit affordances stay
# unavailable on Day 1 and appear the moment preparation first yields one.
documents:
  the_termination_letter:
    hand: both_sides
    title: The termination letter
    body: |
      Two paragraphs over the plant manager's signature, citing performance
      concerns raised "on several occasions" and giving the reassignment as the
      final one. It names no date and attaches nothing.
  the_claimants_own_notes:
    hand: plaintiff
    title: The claimant's own notes
    body: |
      A pocket diary kept from the reassignment onward: who said what, on which
      shift, and the two mornings the claimant was sent home early. It is one
      person's account and reads like one.
  deposition_of_the_supervisor:
    action: depose_witness
    title: Deposition of the plant supervisor
    body: |
      Asked whether the claimant had been warned before the reassignment, the
      supervisor produced two dated memoranda and a signed acknowledgement.
    exhibit:
      target: plaintiff
      shift: 0.25
      bears_on:
        - money
        - reinstatement
  personnel_file:
    action: request_documents
    title: The claimant's personnel file
    body: |
      Eleven years of reviews, none below "meets expectations", and no record of
      the performance concerns raised in the termination letter.
    exhibit:
      target: defendant
      shift: 0.20
      bears_on:
        - money
        - apology
  memorandum_on_comparable_awards:
    action: research_precedent
    title: Memorandum on comparable awards
    body: |
      Fourteen settlements in this circuit over six years, with the terms each
      one turned on. Useful to argue from; not a document to put in front of
      anyone.
  statement_to_the_trade_press:
    action: manage_press
    title: The statement given to the trade press
    body: |
      Four sentences and a name to call, agreed line by line before it went out.
      It says the matter is in hand and says nothing else; what it is worth is
      what it stopped being written instead.
  report_of_the_employment_expert:
    action: retain_expert
    title: The employment expert's report
    body: |
      Thirty pages on what a plant of this size normally documents before a
      reassignment, and what this one did. The conclusion is careful and the
      appendix is where the argument is.
