# The reference Case's skeleton — its identity and its in-fiction calendar.
#
# This is not authored teaching material. Cases are proprietary and live in a
# separate private repository; what sits here is the minimum an engine test and
# a development run need, and the calendar the design's numbers were measured
# against: 10 Days.
---
identifier: bizlaw/reference
name: The Reference Case
licence: Apache-2.0
version: "1.0.0"
published: true
# The Action Budget, measured on prototype/action-budget-pricing rather than
# chosen. The exchange half is an absolute count of points: held as a fraction
# it would couple the brake to the Budget size. Past the knee the preparation
# allowance collapses to roughly the price of a Consult and the exchange half
# widens by one point.
budget:
  per_day: 10
  exchange_pool: 2
  closing_knee: 0.60
  closing_preparation: 2
  closing_exchange: 3
calendar:
  - 2026-03-02
  - 2026-03-03
  - 2026-03-04
  - 2026-03-05
  - 2026-03-06
  - 2026-03-09
  - 2026-03-10
  - 2026-03-11
  - 2026-03-12
  - 2026-03-13
# The Action menu. The kind is engine — the engine knows what deposing a witness
# means — while the cost, the lead time in Days and the half it draws on are
# authored here, because the economy is teaching material rather than engine
# constants. A lead time of 0 lands the result on the Day it was bought.
#
# All of it draws on the preparation half: the exchange half buys an Offer and
# the Exhibits riding it, and nothing else.
actions:
  consult_client:
    cost: 1
    lead_time_days: 0
    half: preparation
  request_documents:
    cost: 2
    lead_time_days: 1
    half: preparation
  research_precedent:
    cost: 2
    lead_time_days: 1
    half: preparation
  manage_press:
    cost: 2
    lead_time_days: 1
    half: preparation
  depose_witness:
    cost: 3
    lead_time_days: 2
    half: preparation
  retain_expert:
    cost: 5
    lead_time_days: 2
    half: preparation
# The two Clients. The bound is how far a Client may be moved across one whole
# Simulation, and it is the one thing about a Client authored as money. Every
# shift against it is a fraction of it, so an Exhibit is worth the same share of
# a Client's travel whether the Section made that Client easy or hard.
clients:
  plaintiff:
    bound: 40000
  defendant:
    bound: 60000
# The vocabulary an Offer is built from and an Exhibit bears on. Terms are
# atomic: a public apology and a private one would be two Terms, never one Term
# with a setting.
terms:
  - money
  - apology
  - nda
  - reinstatement
  - training
  - reference_letter
  - policy_change
# What preparation yields. Every discoverable document sits behind some Action,
# which is what makes *doors visible, contents hidden* checkable.
#
# Some documents also carry an **exhibit** — a target Client, a shift as a
# fraction of that Client's bound, and the Terms it bears on. Whether it is
# favorable is not authored: an Exhibit pointing at the other Side's Client is
# held and played, and one pointing at your own lands the moment you find it.
# So the deposition below is ammunition for the defendant and a hard lesson for
# the plaintiff, and one authored document is both.
documents:
  deposition_of_the_supervisor:
    action: depose_witness
    title: Deposition of the plant supervisor
    body: |
      Asked whether the claimant had been warned before the reassignment, the
      supervisor produced two dated memoranda and a signed acknowledgement.
    exhibit:
      target: plaintiff
      shift: 0.25
      bears_on:
        - money
        - reinstatement
  personnel_file:
    action: request_documents
    title: The claimant's personnel file
    body: |
      Eleven years of reviews, none below "meets expectations", and no record of
      the performance concerns raised in the termination letter.
    exhibit:
      target: defendant
      shift: 0.20
      bears_on:
        - money
        - apology
  memorandum_on_comparable_awards:
    action: research_precedent
    title: Memorandum on comparable awards
    body: |
      Fourteen settlements in this circuit over six years, with the terms each
      one turned on. Useful to argue from; not a document to put in front of
      anyone.
