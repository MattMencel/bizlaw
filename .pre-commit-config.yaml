---
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
        # tsconfig.json is JSONC — TypeScript allows the comments Docusaurus ships.
        exclude: ^docs/tsconfig\.json$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^config/cucumber\.yml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: "v4.2.0"
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # shfmt formats in place. No formatting flags are passed on purpose: shfmt reads
  # .editorconfig only when none are given, which is what keeps it on the repo's
  # two-space indent rather than its own tab default.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write]

  - repo: local
    hooks:
      # ShellCheck's own fixes come out as a patch rather than an in-place edit,
      # so apply them here and let the checker below decide what is left.
      - id: shellcheck-fix
        name: ShellCheck (apply suggested fixes)
        entry: >-
          bash -c 'for f in "$@"; do
          shellcheck --format=diff "$f" 2>/dev/null | git apply --allow-empty - || true;
          done' --
        language: system
        types: [shell]
        require_serial: true

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: rubocop
        name: Rubocop
        entry: bundle exec rubocop --force-exclusion
        language: system
        types: [ruby]
        files: \.rb$
        additional_dependencies: []
      - id: brakeman
        name: Brakeman
        entry: bundle exec brakeman --no-exit-on-warn --no-pager
        language: system
        pass_filenames: false
        always_run: true
        additional_dependencies: []
